name: Release

# A tag vX.Y.Z publishes the GitHub release of that version, with its CHANGELOG.md
# section as the notes (.github/scripts/release-notes.sh). The tag has to be the
# plugin's version. A release that is there already is left as it is.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A release for $TAG exists already; left as it is."
            exit 0
          fi
          bash .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ElastiCORE agent kit ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
